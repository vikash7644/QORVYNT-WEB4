[package]
name = "qorvynt-web4-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Policy-first identity and authorization primitives for QORVYNT Web4"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
